name: YKB CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ykb
          POSTGRES_PASSWORD: ykb_test_password
          POSTGRES_DB: ykb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ykb -d ykb_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://ykb:ykb_test_password@localhost:5432/ykb_test?schema=public
      - run: pnpm db:deploy
        env:
          DATABASE_URL: postgresql://ykb:ykb_test_password@localhost:5432/ykb_test?schema=public
      - run: pnpm typecheck
        env:
          DATABASE_URL: postgresql://ykb:ykb_test_password@localhost:5432/ykb_test?schema=public
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://ykb:ykb_test_password@localhost:5432/ykb_test?schema=public
      - run: pnpm lint
        env:
          DATABASE_URL: postgresql://ykb:ykb_test_password@localhost:5432/ykb_test?schema=public
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://ykb:ykb_test_password@localhost:5432/ykb_test?schema=public
